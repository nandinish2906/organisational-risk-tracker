{% extends "risks/base.html" %}
{% block title %}Login | RiskTrack{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-6 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h3 mb-2">Welcome back</h1>
        <p class="text-secondary">Sign in to manage organisational risks.</p>
        {% if form.errors %}<div class="alert alert-danger">Username or password is incorrect.</div>{% endif %}
        <form method="post">
          {% csrf_token %}
          <div class="mb-3"><label class="form-label" for="id_username">Username</label>{{ form.username }}</div>
          <div class="mb-3"><label class="form-label" for="id_password">Password</label>{{ form.password }}</div>
          <input type="hidden" name="next" value="{{ next }}">
          <button class="btn btn-primary w-100" type="submit">Log in</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
